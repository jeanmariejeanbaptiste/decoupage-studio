name: Intégration continue

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Tests de bout en bout
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-rav3
          path: test-results/export-rav3.*
          if-no-files-found: ignore
