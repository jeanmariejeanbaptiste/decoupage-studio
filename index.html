<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Découpage technique intelligent : grille vivante, minutage, export PDF fidèle, registre et listes de matériel." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Découpage Studio</title>
    <script>
      try {
        if (localStorage.getItem('ds-theme') === 'encre') {
          document.documentElement.dataset.theme = 'encre';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1115');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
